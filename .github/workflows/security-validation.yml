name: Security Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  security-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Cilium policies
        run: bash scripts/validate-cilium-policies.sh

      - name: Validate security files
        run: bash tests/security/security-files.sh

      - name: Validate runtime rules
        run: bash tests/runtime/falco-rules.sh
